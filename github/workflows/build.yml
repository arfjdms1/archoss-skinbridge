name: Build SkinBridge JAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # This allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Standard for modern Minecraft/Kotlin plugins
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build shadowJar -Partifactory_contextUrl="https://dummy.com" -Partifactory_user="dummy" -Partifactory_password="dummy"
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SkinBridge-Compiled
        path: build/libs/*.jar
